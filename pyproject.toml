[project]
name = "workspace-council"
version = "0.1.0"
description = "A native Agno agent team that researches, writes, reviews, and publishes into Ambiguous"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "agno[agui,exa,mcp,openai,os]==3.0.9",
    "python-dotenv>=1.1.0",
]

[project.scripts]
workspace-council = "workspace_council.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "ruff>=0.12.0",
]
